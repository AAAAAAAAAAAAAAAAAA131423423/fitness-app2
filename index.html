<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FITNESS V.1</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="status">☁️ Bağlanıyor...</div>
    <div id="app">
        <select id="gun">
            <option value="pzt">Pazartesi</option>
            <option value="sal">Salı</option>
        </select>
        <button onclick="kaydet()">KAYDET</button>
    </div>

    <script>
        const firebaseConfig = {
    apiKey: "AIzaSycjwH4qtc41tc-Hsb6bPEEg5OycZHIgMl8",
    authDomain: "fitnessprogrami1.firebaseapp.com",
    databaseURL: "https://fitnessprogrami1-default-rtdb.europe-west1.firebasedatabase.app/", // <-- BURAYI GÜNCELLEDİK
    projectId: "fitnessprogrami1",
    storageBucket: "fitnessprogrami1.firebasestorage.app",
    messagingSenderId: "80435205342",
    appId: "1:80435205342:web:e265b3c7cfce1b43193a4f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function kaydet() {
            const gun = document.getElementById('gun').value;
            // Veriyi tam olarak 'saved_workout_days' altına yazıyoruz
            db.ref('saved_workout_days/' + gun).set({ tamamlandi: true, tarih: new Date().toISOString() })
            .then(() => alert("Kayıt Başarılı!"))
            .catch(err => alert("Hata: " + err.message));
        }

        // Sayfa açıldığında veriyi kontrol et
        db.ref('saved_workout_days').on('value', (snap) => {
            console.log("Buluttaki güncel veri:", snap.val());
            document.getElementById('status').innerText = "✅ Senkronize: " + JSON.stringify(snap.val());
        });
    </script>
</body>
</html>
